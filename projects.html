<section class="projects-section pt-40">
  <div class="container " >

    <!-- Project Filter -->
    <div class="project-filter d-flex align-items-center flex-wrap tw-gap-8">
      <button
        type="button"
        class="project-filter-btn active"
        data-filter="all"
      >
        All
      </button>

      <button
        type="button"
        class="project-filter-btn"
        data-filter="software-engineering"
      >
        Software Engineering
      </button>

      <button
        type="button"
        class="project-filter-btn"
        data-filter="data-analytics"
      >
        Data Analytics
      </button>

      <button
        type="button"
        class="project-filter-btn"
        data-filter="bi-engineering"
      >
        BI Engineering
      </button>
    </div>

    <!-- Project List -->
    <div class="row project-list">

      <!-- Software Engineering -->
      <div
        class="col-lg-4 col-md-6 project-item"
        data-category="software-engineering"
      >

          <h3>Project Name</h3>
          <p>Software Engineering</p>

      <!-- Data Analytics -->

<script>
    document.addEventListener("DOMContentLoaded", () => {
    const filterButtons = document.querySelectorAll(".project-filter-btn");
    const projectItems = document.querySelectorAll(".project-item");

    filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
        const filter = button.dataset.filter;

        filterButtons.forEach((btn) => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        projectItems.forEach((item) => {
            const category = item.dataset.category;

            if (filter === "all" || category === filter) {
            item.classList.remove("is-hidden");
            } else {
            item.classList.add("is-hidden");
            }
        });
        });
    });
    });
    </script>
