<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* CSS Reset & Layout Utama */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Canvas Kursor (WAJIB Ada CSS Ini) */
        #cursor-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Mencegah canvas menghalangi interaksi mouse */
            z-index: 9999;
        }

        /* Animasi Fade-In untuk H1 */
        h1 {
            font-size: 20vh;
            line-height: 1;
            margin: 0;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInIntro 1.2s ease-out forwards;
        }

        @keyframes fadeInIntro {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Styling & Animasi Kursor untuk P */
        p {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #cccccc;
            min-height: 2rem;
        }

        .typing-text::after {
            content: '|';
            display: inline-block;
            margin-left: 3px;
            color: #ffffff;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .typing-text.done::after {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Canvas Elemen untuk Animasi Goresan Kursor -->
    <canvas id="cursor-canvas"></canvas>

    <h1>Coming Soon</h1>
    <p id="typed-text"></p>

    <script>
        /* ==========================================
           1. ANIMASI MENGETIK (TYPING EFFECT)
           ========================================== */
        const textToType = "This portfolio is still under development.";
        const element = document.getElementById("typed-text");
        let index = 0;
        const speed = 60;

        function typeWriter() {
            if (index < textToType.length) {
                element.innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                element.classList.add("done");
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            element.classList.add("typing-text");
            setTimeout(typeWriter, 600);
        });

        /* ==========================================
           2. ANIMASI KURSOR SMOOTH TRAIL (CANVAS)
           ========================================== */
        const canvas = document.getElementById('cursor-canvas');
        const ctx = canvas.getContext('2d');

        // Set ukuran awal canvas sesuai jendela browser
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        window.addEventListener('resize', resizeCanvas);

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const trail = [];
        const maxTrailLength = 20;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function animateCursor() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tambahkan koordinat terbaru mouse
            trail.push({ x: mouse.x, y: mouse.y });

            if (trail.length > maxTrailLength) {
                trail.shift();
            }

            if (trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);

                for (let i = 1; i < trail.length - 1; i++) {
                    const xc = (trail[i].x + trail[i + 1].x) / 2;
                    const yc = (trail[i].y + trail[i + 1].y) / 2;
                    ctx.quadraticCurveTo(trail[i].x, trail[i].y, xc, yc);
                }

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';

                ctx.stroke();
            }

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
